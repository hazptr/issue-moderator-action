name: Issue moderator with commands
description: Automatically close or lock issues based on commands.
author: keiyoushi
branding:
  icon: alert-circle
  color: red
runs:
  using: node24
  main: dist/index.js
inputs:
  repo-token:
    required: true
    description: GitHub token
  member-token:
    required: false
    description: Token with read access to organization members
  duplicate-label:
    required: false
    description: Label to add on duplicate command and auto duplicate check

  blurb-command:
    required: false
    default: Blurb
    description: Command to close an issue with a blurb posted as a comment
  delete-command:
    required: false
    default: Delete this issue
    description: Command to delete an issue
  edit-title-command:
    required: false
    default: Edit title to
    description: Command to edit the title of an issue
  lock-command:
    required: false
    default: Lock this issue
    description: Command to lock an issue
  not-down-command:
    required: false
    default: Source is not down
    description: Command anyone can use to say a reported source still works
  remove-command:
    required: false
    default: Remove this source
    description: Command to open the removal pull request for a reported source now
  duplicate-command:
    required: false
    default: 'Duplicate of #'
    description: Command to close a duplicate issue

  blurbs:
    required: false
    description: |
      A JSON-compliant string containing a list of blurbs, where a blurb consists of:

      {
        keywords: string[];  // Aliases for the blurb.
        message: string;     // Message to post when closing the issue.
      }

  duplicate-check-enabled:
    required: false
    description: >
      Control if the action should search for duplicate URLs in opened issues.
  duplicate-check-labels:
    required: false
    description: >
      A JSON-compliant string containing a list of label names as strings.
      Required if `duplicate-check-enabled` is enabled.
  duplicate-check-comment:
    required: false
    description: >
      The body of the comment when an issue is detected to be a duplicate.
    default: |
      This issue was closed because it is a duplicate of {duplicateIssuesText}.

      *This is an automated action. If you think this is a mistake, please comment about it so the issue can be reopened if needed.*

  existing-check-enabled:
    required: false
    description: >
      Control if the action should search the extension repository for existing sources.
  existing-check-labels:
    required: false
    description: >
      A JSON-compliant string containing a list of label names as strings to check.
      Required if `existing-check-enabled` is enabled.
  existing-check-repo-url:
    required: false
    description: >
      The URL of the JSON extensions repository.
      Required if `existing-check-enabled` is enabled.
    default: https://raw.githubusercontent.com/keiyoushi/extensions/refs/heads/repo/index.json
  existing-check-comment:
    required: false
    description: >
      The body of the comment when an issue is detected to be of an existing source.
    default: |
      This request was closed because an extension with the provided URL ({requestUrl}) already exists with the name of **{extensionName}** (version **{extensionVersion})**, under the **{extensionLang}** section.

      *This is an automated action. If you think this is a mistake, please comment about it so the issue can be reopened if needed.*

  url-search-sections:
    required: false
    description: >
      A JSON-compliant string containing a list of issue sections to check for URLs. Applies to duplicate and existing checks.
      If defined, only the specified sections are checked.
      If not defined or if an empty list is provided, the whole issue body is checked.
    default: |
      []

  auto-close-rules:
    required: false
    description: |
      A JSON-compliant string containing a list of rules, where a rule consists of:

      {
        type: 'title' | 'body' | 'both';    // Part to run regex against.
        regex: string;                      // Pattern which if matched closes the issue.
        closeIfMatch: boolean | undefined;  // Whether to close if the regex is matched or not.
        ignoreCase: boolean | undefined;    // Defines if the regex will be case insensitive.
        message: string;                    // Message to post when closing the issue.
                                            // You can use {match} as a placeholder to the first match.
        labels: string[] | undefined;       // Labels to add when closing the issue.
      }
  auto-close-ignore-label:
    required: false
    description: Optional label name. If present, auto-close rule execution is skipped.

  dry-run:
    required: false
    description: Log the writes the source check and source removal would make instead of making them.

  source-check-enabled:
    required: false
    description: >
      Control if the action should check that source reports name an existing extension.
      Uses `existing-check-repo-url` for the list of extensions.
  source-check-labels:
    required: false
    description: >
      A JSON-compliant string containing a list of label names as strings to check.
      Required if `source-check-enabled` is enabled.
  source-check-exclude-labels:
    required: false
    description: >
      A JSON-compliant string containing a list of label names that skip the source check,
      e.g. source requests that were closed with the source down label.
    default: |
      []
  source-check-not-found-comment:
    required: false
    description: >
      The body of the comment when no extension matches the report. `{reportedName}` is the name as reported.
    default: |
      This report was closed because no extension matches **{reportedName}**. Edit the report to use the extension name exactly as shown in **Browse → Extensions**, or the source's link, and it will be reopened.
  previously-deleted-label:
    required: false
    description: Label to add when the reported extension was removed before.
  source-check-previously-deleted-comment:
    required: false
    description: >
      The body of the comment when the reported extension was removed before.
      `{reportedName}` is the name as reported, `{commitUrl}` the commit that removed it.
    default: |
      This report was closed because **{reportedName}** was already removed from the repository in {commitUrl}.
  site-issues-label:
    required: false
    description: >
      Label for issues where part of an extension fails because of the site itself.
      New reports for the same extension are closed as duplicates, and these issues are never removed automatically.
  site-issues-duplicate-comment:
    required: false
    description: >
      The body of the comment when a report duplicates an open site issue.
      `{extensionName}` and `{issueNumber}` are available.
    default: |
      This report was closed because #{issueNumber} already tracks a problem with **{extensionName}** that comes from the site itself.

  removal-enabled:
    required: false
    description: >
      Control if the action should open pull requests removing extensions whose down reports stayed open.
      Runs on `schedule` and `workflow_dispatch` events.
  source-down-label:
    required: false
    default: Source is down
    description: Label of source down reports.
  removal-days:
    required: false
    default: '14'
    description: Days a report has to carry `source-down-label` before the extension is removed.
  removal-exclude-labels:
    required: false
    description: >
      A JSON-compliant string containing a list of label names that keep a report from automatic removal.
      `disputed-label`, `site-issues-label` and `auto-close-ignore-label` always do.
    default: |
      []
  source-request-label:
    required: false
    description: >
      Label of source requests. A source request that also carries `source-down-label` for `removal-days`
      is closed instead of removed; only `disputed-label` and `auto-close-ignore-label` stop that.
  source-request-down-comment:
    required: false
    description: >
      The body of the comment when a source request is closed because its site stayed down. `{days}` is available.
    default: |
      This request was closed because the site has been down for {days} days. Open a new request if it comes back.
  disputed-label:
    required: false
    default: Disputed
    description: Label added when someone says a reported source still works.
  pr-token:
    required: false
    description: >
      Token used to push removal branches and open pull requests. Needs contents and pull requests write.
      Pull requests opened with the default GITHUB_TOKEN do not start other workflows. Defaults to `repo-token`.
